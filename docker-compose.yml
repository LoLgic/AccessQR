services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accessqr
      POSTGRES_PASSWORD: accessqr
      POSTGRES_DB: accessqr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessqr -d accessqr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
